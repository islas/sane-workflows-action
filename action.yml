name: sane-workflows
description: "Run a set of actions using sane-workflows"
branding:
  icon: wind
  color: green

inputs:
  id:
    description: ID of workflow run, i.e. name
    required : true
    type     : string
  paths:
    description: List of paths pointing to workflow(s)
    required : true
    type     : array

  # Everything else is optional
  dry_run:
    description: Enable dry-run of tests instead
    required   : false
    type       : boolean
    default    : false
  host:
    description: Specific host to run workflow as
    required : false
    type     : string
    default  : ''
  actions:
    description: Actions list to run
    required : false
    type     : string
    default  : '[]'
  actions_filter:
    description: Actions filter to run, each applied separately
    required : false
    type     : string
    default  : '[]'
  args     :
    description: Additional args to pass to sane_runner
    required : false
    type     : string
    default  : ''
  patch:
    description: One-time patch dict allowed for modification of workflow, need be
    required : false
    type     : string
    default  : ''
  upload :
    description: When to upload logs as an artifact (none, always, or on_failure)
    required : false
    type     : string
    default  : 'on_failure'

  # Python environment management
  cache:
    description: Whether to cache the python virtual environment
    required : false
    type     : boolean
    default  : false
  cache_id:
    description: Specific cache id to use, if not set the key will be inputs.id
    required : false
    type     : string
    default  : ''
  venv:
    description: Path to setup python virtual environment at
    required : false
    type     : string
    default  : './venv/sane'
  python_dependencies:
    description: Extra python dependencies list needed for workflow
    required : false
    type     : array
    default  : '[]'
  upgrade:
    description: Use pip install --upgrade when installing dependencies, not recommended with cache
    required : false
    type     : boolean
    default  : true
  pre:
    description: Allow pre-release in install of SANE Workflows
    required : false
    type     : boolean
    default  : false
  version:
    description: Specify version of SANE Workflows
    required : false
    type     : string
    default  : latest

outputs:
  save_location:
    description: Location of workflow saves
    value: ${{ steps.sane.outputs.save_location }}
  log_location:
    description: Location of workflow logs
    value: ${{ steps.sane.outputs.log_location }}

runs:
  using: "composite"
  steps:
  - name: Validate upload policy
    shell: bash
    env:
      UPLOAD_POLICY: ${{ inputs.upload }}
    run: |
      case "$UPLOAD_POLICY" in
        none|always|on_failure) ;;
        *)
          echo '::error::upload must be one of: none, always, on_failure'
          exit 1
          ;;
      esac

  - if: ${{ inputs.cache == 'true' }}
    name: Cache python environment
    id: cache-venv
    uses: actions/cache@v6
    with:
      path: |
        ${{ inputs.venv }}
      key: venv-${{ inputs.cache_id || inputs.id }}

  - if: ${{ inputs.cache == 'false' || steps.cache-venv.outputs.cache-hit != 'true' }}
    name: Install sane-workflows
    id  : install-sane
    shell: bash
    run: |
      if [ -f "${{ inputs.venv }}/bin/activate" ]; then
        . ${{ inputs.venv }}/bin/activate
      else
        python3 -m venv ${{ inputs.venv }}
        . ${{ inputs.venv }}/bin/activate
      fi

      if [ "${{ inputs.pre }}" = "true" ]; then
        PRE="--pre"
      fi
      if [ "${{ inputs.version }}" != "latest" ]; then
        VERSION="==${{ inputs.version }}"
      fi

      python3 -m pip install --no-cache-dir ${{ inputs.upgrade == 'true' && '--upgrade' || '' }} $PRE sane-workflows$VERSION

      if [ "${{ inputs.python_dependencies }}" != "[]" ]; then
        python3 -m pip install --no-cache-dir ${{ inputs.upgrade == 'true' && '--upgrade' || '' }} ${{ join( fromJson( inputs.python_dependencies ), ' ' ) }}
      fi

  - name: Run ${{ inputs.id }}
    id  : sane
    env:
      SANE_PATCH: ${{ inputs.patch }}
      ACTIONS_FILTER: ${{ join( fromJson( inputs.actions_filter ), ' -f ' ) }}
    shell: bash
    run: |
      RUN_FLAG="-r"
      if [ "${{ inputs.dry_run }}" = "true" ]; then
        RUN_FLAG="-d"
      fi
      if [ -n "$ACTIONS_FILTER" ]; then
        ACTIONS_FILTER="-f $ACTIONS_FILTER"
      fi
      if [ "${{ inputs.actions }}" != "[]" ]; then
        ACTIONS="-a ${{ join( fromJson( inputs.actions ), ' ' ) }}"
      fi
      if [ ! -z "${{ inputs.host }}" ]; then
        HOST="-sh ${{ inputs.host }}"
      fi
      if [ -n "$SANE_PATCH" ]; then
        mkdir -p .patch-${{ inputs.id }}/
        printf '{ "patches": %s }\n' "$SANE_PATCH" > .patch-${{ inputs.id }}/patch.json
        PATCH="-p .patch-${{ inputs.id }}/"
      fi
      . ${{ inputs.venv }}/bin/activate

      echo "save_location=.${{ inputs.id }}_saves" >> $GITHUB_OUTPUT
      echo "log_location=${{ inputs.id }}_logs" >> $GITHUB_OUTPUT

      # Keep regex metacharacters from expanding into matching filenames.
      set -f
      sane_runner ${{ inputs.args }} $ACTIONS $ACTIONS_FILTER $HOST $PATCH \
        -p ${{ join( fromJson( inputs.paths ), ' -p ' ) }} \
        -sl .${{ inputs.id }}_saves \
        -ll  ${{ inputs.id }}_logs  \
        $RUN_FLAG

  - if  : ${{ always() && (inputs.upload == 'always' || (inputs.upload == 'on_failure' && failure())) }}
    name: Upload test logs
    uses : actions/upload-artifact@v7
    with:
      name: ${{ inputs.id }}_logfiles
      path: ${{ inputs.id }}_logs
      include-hidden-files: true
